<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>環面直落四子 - FuGames</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml"><link rel="stylesheet" href="fulab-theme.css">
  <style>

    .board { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; width: min(100%, 480px); }
    .colBtn { min-height: 44px; padding: 0; border: 1px solid var(--fulab-silver); border-radius: 10px; background: white; color: var(--fulab-ink-teal); font-size: 18px; cursor: pointer; }
    .colBtn:hover { border-color: var(--fulab-teal); }
    .colBtn:disabled { opacity: .4; cursor: default; }
    .grid { grid-column: 1 / -1; display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
    .cell { aspect-ratio: 1; border: 1px solid var(--fulab-silver); border-radius: 10px; background: white; display: grid; place-items: center; font-size: clamp(23px, 6vw, 40px); min-width: 0; }
    .cell.win { background: var(--fulab-tint-emerald); border-color: var(--fulab-emerald); }
    .cell.last { box-shadow: inset 0 0 0 2px var(--fulab-tint-indigo); }
    @media(max-width: 400px) { .board, .grid { gap: 4px; } .game-floor { padding: 8px; } .cell { border-radius: 7px; } }

  </style>
</head>
<body>
  <main class="game-page">
    <nav class="site-nav" aria-label="遊戲導覽"><a class="site-brand" href="index.html"><span class="brand-mark" aria-hidden="true"><i></i><i></i><i></i><i></i></span>FuGames</a><a href="index.html">所有遊戲 ↗</a></nav>
    <header class="page-header"><p class="eyebrow">棋盤 / 同機雙人</p><h1>環面直落四子</h1><p class="lead">輪流選一欄落子，連成四子就贏；連線也能繞過棋盤邊界。</p></header>
    <section class="card play-panel" aria-label="直落四子棋盤">
      <div class="game-toolbar"><p class="game-status" id="statusText" role="status" aria-live="polite"></p><div class="game-metrics"><span>回合 <strong id="turnKpi">0</strong></span><span>落子 <strong id="playerKpi">黑</strong></span></div></div>
      <div class="boardWrap game-floor"><div class="board"><button class="colBtn" data-col="0" aria-label="第 1 欄落子">↓</button><button class="colBtn" data-col="1" aria-label="第 2 欄落子">↓</button><button class="colBtn" data-col="2" aria-label="第 3 欄落子">↓</button><button class="colBtn" data-col="3" aria-label="第 4 欄落子">↓</button><button class="colBtn" data-col="4" aria-label="第 5 欄落子">↓</button><button class="colBtn" data-col="5" aria-label="第 6 欄落子">↓</button><button class="colBtn" data-col="6" aria-label="第 7 欄落子">↓</button><div class="grid" id="grid" role="img" aria-label="七欄六列棋盤"></div></div></div>
      <div class="game-actions"><p class="action-note">點上方箭頭，棋子會直落到底</p><button class="btn primary" id="newGame">重新開始</button></div>
    </section>
    <details class="card rules"><summary>玩法與操作</summary><div class="rules-body"><ul class="list"><li>兩位玩家輪流選欄落子，棋子落到該欄最底的空格。</li><li>橫、直、斜線都可繞過邊界；連成四子即勝。</li><li>棋盤填滿且無連線則平手。</li></ul></div></details>
    <footer class="site-footer">FuGames · 隨時來一局</footer>
  </main>

  <script>
    const ROWS = 6, COLS = 7;
    const gridEl = document.getElementById('grid');
    const statusEl = document.getElementById('statusText');
    const turnEl = document.getElementById('turnKpi');
    const playerEl = document.getElementById('playerKpi');
    const colBtns = Array.from(document.querySelectorAll('.colBtn'));
    const newBtn = document.getElementById('newGame');

    let board, player, turn, over, winCells, lastMove;

    function reset() {
      board = Array.from({length: ROWS}, () => Array(COLS).fill(''));
      player = 'B'; // B = 黑, W = 白
      turn = 0;
      over = false;
      winCells = new Set();
      lastMove = null;
      render();
    }

    function drop(col) {
      if (over) return;
      for (let r = ROWS - 1; r >= 0; r--) {
        if (board[r][col] === '') {
          board[r][col] = player;
          lastMove = `${r}-${col}`;
          turn++;
          const wl = checkWin(r, col);
          if (wl) {
            over = true;
            wl.forEach(k => winCells.add(k));
            render();
            return;
          }
          if (turn >= ROWS * COLS) {
            over = true;
            render();
            return;
          }
          player = (player === 'B') ? 'W' : 'B';
          render();
          return;
        }
      }
    }

    // Wrap-aware win detection
    function checkWin(r, c) {
      const directions = [
        [1, 0], [0, 1], [1, 1], [1, -1]
      ];
      for (const [dr, dc] of directions) {
        const cells = [];
        for (let k = 0; k < 4; k++) {
          const rr = (r + dr * k + ROWS) % ROWS;
          const cc = (c + dc * k + COLS) % COLS;
          cells.push(`${rr}-${cc}`);
        }
          const val = cells.map(keyToVal).every(v => v === player);
        if (val) return cells;
      }
      // also need to scan backwards start to catch other sequences
      for (const [dr, dc] of directions) {
        for (let offset = -3; offset <= 0; offset++) {
          const cells2 = [];
          for (let k = 0; k < 4; k++) {
            const rr = (r + dr * (offset + k) + ROWS) % ROWS;
            const cc = (c + dc * (offset + k) + COLS) % COLS;
            cells2.push(`${rr}-${cc}`);
          }
          const val2 = cells2.map(keyToVal).every(v => v === player);
          if (val2) return cells2;
        }
      }
      return null;
    }

    function keyToVal(key) {
      const [r, c] = key.split('-').map(Number);
      return board[r][c];
    }

    function render() {
      gridEl.innerHTML = '';
      turnEl.textContent = String(turn);
      playerEl.textContent = (player === 'B') ? '黑' : '白';

      const fullCols = new Set();
      for (let c = 0; c < COLS; c++) {
        if (board[0][c] !== '') fullCols.add(c);
      }
      colBtns.forEach(btn => {
        const col = Number(btn.dataset.col);
        btn.disabled = over || fullCols.has(col);
        btn.onclick = () => drop(col);
      });

      for (let r = 0; r < ROWS; r++) {
        for (let c = 0; c < COLS; c++) {
          const cell = document.createElement('div');
          cell.className = 'cell';
          const key = `${r}-${c}`;
          const v = board[r][c];
          cell.textContent = v ? symbol(v) : '';
          if (v === 'B') {
            cell.style.color = '#2E3440';
            cell.style.textShadow = '';
          } else if (v === 'W') {
            cell.style.color = '#FFFFFF';
            cell.style.textShadow = '0 0 2px #2E3440, 0 0 1px #2E3440';
          } else {
            cell.style.color = '';
            cell.style.textShadow = '';
          }
          if (winCells.has(key)) cell.classList.add('win');
          if (lastMove === key) cell.classList.add('last');
          gridEl.appendChild(cell);
        }
      }

      if (over) {
        if (winCells.size > 0) {
        statusEl.textContent = `${playerEl.textContent} 連成四子！`;
      } else {
        statusEl.textContent = '平手，棋盤已滿。';
      }
    } else {
      statusEl.textContent = `輪到 ${playerEl.textContent}`;
    }
    }

    newBtn.addEventListener('click', reset);
    reset();

    function symbol(v) {
      if (v === 'B') return '●';
      if (v === 'W') return '○';
      return '';
    }
  </script>
</body>
</html>
